<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEMS | Expense Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <div class="sidebar-overlay" id="mobileOverlay" onclick="toggleSidebar()"></div>

    <div class="sidebar glass-panel d-flex flex-column p-4" id="mainSidebar">
        <h3 class="fw-bold mb-5"><i class="fa-solid fa-gem text-primary me-2"></i>GEMS</h3>
        <ul class="nav nav-pills flex-column mb-auto gap-2">
            <li><a href="#" class="nav-link active" onclick="switchView('add-expense')"><i class="fa-solid fa-plus me-3"></i> Record Expense</a></li>
            <li><a href="#" class="nav-link" onclick="switchView('dashboard')"><i class="fa-solid fa-chart-line me-3"></i> Analytics</a></li>
            <li><a href="#" class="nav-link" onclick="switchView('reports')"><i class="fa-solid fa-table-list me-3"></i> Reports</a></li>
            <li><a href="#" class="nav-link" onclick="switchView('admin')"><i class="fa-solid fa-gear me-3"></i> Admin Panel</a></li>
        </ul>
    </div>

    <div class="main-content" id="mainContent">
        <nav class="navbar glass-panel mb-4 px-4 py-3 rounded-4">
            <span class="navbar-brand fw-bold" id="pageTitle">Record Expense</span>
            <button class="btn glass-panel" onclick="toggleTheme()"><i class="fa-solid fa-circle-half-stroke"></i></button>
        </nav>

        <div id="add-expense" class="view-section active">
            <!-- Expense Form Content -->
        </div>
        <div id="dashboard" class="view-section">
            <!-- Analytics Content -->
        </div>
        <div id="reports" class="view-section">
            <!-- Data Table -->
        </div>
        <div id="admin" class="view-section">
            <!-- Project Management -->
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="app.js"></script>
</body>
</html>
