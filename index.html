<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GEMS | Expense Management System</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/buttons/2.4.1/css/buttons.bootstrap5.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>

    <div class="sidebar-overlay" id="mobileOverlay" onclick="toggleSidebar()"></div>

    <div class="sidebar glass-panel d-flex flex-column p-3" id="mainSidebar">
        <div class="d-flex justify-content-between align-items-center mb-4 mt-2">
            <h4 class="text-center fw-bold m-0"><i class="fa-solid fa-gem text-warning me-2"></i>GEMS</h4>
            <button class="btn btn-sm d-md-none text-secondary" onclick="toggleSidebar()"><i class="fa-solid fa-xmark fs-4"></i></button>
        </div>
        <ul class="nav nav-pills flex-column mb-auto">
            <li class="nav-item">
                <a href="#" class="nav-link active" onclick="switchView('add-expense')"><i class="fa-solid fa-plus me-2"></i> Add Expense</a>
            </li>
            <li>
                <a href="#" class="nav-link" onclick="switchView('dashboard')"><i class="fa-solid fa-chart-pie me-2"></i> Dashboard</a>
            </li>
            <li>
                <a href="#" class="nav-link" onclick="switchView('reports')"><i class="fa-solid fa-table me-2"></i> Reports & Exports</a>
            </li>
        </ul>
    </div>

    <div class="main-content" id="mainContent">
        
        <nav class="navbar glass-panel navbar-expand mb-4 px-3 py-2">
            <div class="container-fluid p-0">
                <div class="d-flex align-items-center">
                    <button class="btn btn-sm glass-panel me-3 d-md-none" onclick="toggleSidebar()">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                    <span class="navbar-brand mb-0 h5 fw-bold text-truncate" id="pageTitle" style="max-width: 200px;">Record Expense</span>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <button class="btn btn-sm glass-panel" onclick="toggleTheme()" title="Toggle Dark Mode">
                        <i class="fa-solid fa-moon"></i>
                    </button>
                </div>
            </div>
        </nav>

        <div class="toast-container position-fixed top-0 end-0 p-3">
            <div id="appToast" class="toast align-items-center text-bg-primary border-0 shadow glass-panel" role="alert">
                <div class="d-flex">
                    <div class="toast-body fw-bold" id="toastMsg">Message here</div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
                </div>
            </div>
        </div>

        <div id="add-expense" class="view-section active">
            <div class="card glass-panel border-0">
                <div class="card-body p-3 p-md-4">
                    <form id="expenseForm">
                        <div class="row g-3">
                            <div class="col-12 col-md-3">
                                <label class="fw-bold small">Date *</label>
                                <input type="date" class="form-control glass-panel" id="date" required>
                            </div>
                            <div class="col-12 col-md-3">
                                <label class="fw-bold small">Company *</label>
                                <select class="form-select glass-panel" id="company" required>
                                    <option value="" disabled selected>Select Company...</option>
                                    <option value="GVR Contractors">GVR Contractors</option>
                                    <option value="KRiyatech">KRiyatech</option>
                                </select>
                            </div>
                            <div class="col-12 col-md-3">
                                <label class="fw-bold small">Project / Site *</label>
                                <input type="text" class="form-control glass-panel" id="project" placeholder="e.g. Odalarevu" required>
                            </div>
                            <div class="col-12 col-md-3">
                                <label class="fw-bold small">Entered By *</label>
                                <select class="form-select glass-panel" id="enteredBy" required>
                                    <option value="" disabled selected>Select Partner...</option>
                                    <option value="Gopinath">Gopinath</option>
                                    <option value="Satish">Satish</option>
                                    <option value="Partner 3">Partner 3</option>
                                </select>
                            </div>
                            
                            <div class="col-12">
                                <label class="fw-bold small">Description *</label>
                                <input type="text" class="form-control glass-panel" id="description" required>
                            </div>
                            
                            <div class="col-6 col-md-3">
                                <label class="fw-bold small">Amount (₹) *</label>
                                <input type="number" class="form-control glass-panel" id="amount" required>
                            </div>
                            <div class="col-6 col-md-3">
                                <label class="fw-bold small">Payment Mode *</label>
                                <select class="form-select glass-panel" id="paymentMode" required>
                                    <option value="Bank Transfer">Bank Transfer</option>
                                    <option value="UPI">UPI</option>
                                    <option value="Cash">Cash</option>
                                </select>
                            </div>
                            <div class="col-12 col-md-3">
                                <label class="fw-bold small">Transaction ID</label>
                                <input type="text" class="form-control glass-panel" id="transactionId">
                            </div>
                            <div class="col-12 col-md-3">
                                <label class="fw-bold small">Upload Bill</label>
                                <input type="file" class="form-control glass-panel" id="billFile" accept="image/*,.pdf">
                            </div>
                        </div>
                        <hr class="my-4 border-secondary">
                        <button type="submit" class="btn btn-primary w-100 py-3 fw-bold" id="submitBtn">
                            <i class="fa-solid fa-cloud-arrow-up me-2"></i> Submit Expense
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <div id="dashboard" class="view-section">
            <div class="glass-panel p-3 mb-4">
                <div class="row g-2">
                    <div class="col-6 col-md-2">
                        <label class="form-label text-muted small fw-bold mb-1"><i class="fa-solid fa-calendar-arrow-down me-1"></i> Start</label>
                        <input type="date" class="form-control form-control-sm glass-panel" id="filterStartDate" onchange="applyFilters()">
                    </div>
                    <div class="col-6 col-md-2">
                        <label class="form-label text-muted small fw-bold mb-1"><i class="fa-solid fa-calendar-arrow-up me-1"></i> End</label>
                        <input type="date" class="form-control form-control-sm glass-panel" id="filterEndDate" onchange="applyFilters()">
                    </div>
                    <div class="col-6 col-md-2">
                        <label class="form-label text-muted small fw-bold mb-1"><i class="fa-solid fa-calendar-days me-1"></i> Month</label>
                        <select class="form-select form-select-sm glass-panel" id="filterMonthYear" onchange="applyFilters()">
                            <option value="All">All Months</option>
                        </select>
                    </div>
                    <div class="col-6 col-md-2">
                        <label class="form-label text-muted small fw-bold mb-1"><i class="fa-solid fa-building me-1"></i> Company</label>
                        <select class="form-select form-select-sm glass-panel" id="filterCompany" onchange="applyFilters()">
                            <option value="All">All Companies</option>
                            <option value="GVR Contractors">GVR Contractors</option>
                            <option value="KRiyatech">KRiyatech</option>
                        </select>
                    </div>
                    <div class="col-6 col-md-2">
                        <label class="form-label text-muted small fw-bold mb-1"><i class="fa-solid fa-helmet-safety me-1"></i> Project</label>
                        <select class="form-select form-select-sm glass-panel" id="filterProject" onchange="applyFilters()">
                            <option value="All">All Projects</option>
                        </select>
                    </div>
                    <div class="col-6 col-md-2">
                        <label class="form-label text-muted small fw-bold mb-1"><i class="fa-solid fa-user-pen me-1"></i> User</label>
                        <select class="form-select form-select-sm glass-panel" id="filterUser" onchange="applyFilters()">
                            <option value="All">All Users</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="row g-3 mb-4">
                <div class="col-12 col-md-6">
                    <div class="kpi-card glass-panel">
                        <i class="fa-solid fa-wallet"></i>
                        <h6 class="text-muted mb-1">Total Filtered Expenses</h6>
                        <h2 id="kpi-total" class="fw-bold m-0">₹0</h2>
                    </div>
                </div>
                <div class="col-12 col-md-6">
                    <div class="kpi-card glass-panel">
                        <i class="fa-solid fa-building"></i>
                        <h6 class="text-muted mb-1">GVR vs KRiyatech</h6>
                        <h4 class="mb-0 fw-bold" id="kpi-company">GVR: ₹0 | KRI: ₹0</h4>
                    </div>
                </div>
            </div>
            
            <div class="row g-3">
                <div class="col-12 col-md-4"><div class="chart-box glass-panel"><canvas id="companyChart"></canvas></div></div>
                <div class="col-12 col-md-8"><div class="chart-box glass-panel"><canvas id="trendChart"></canvas></div></div>
                <div class="col-12 col-md-6 mt-md-4"><div class="chart-box glass-panel"><canvas id="paymentChart"></canvas></div></div>
            </div>
        </div>

        <div id="reports" class="view-section">
            <div class="card glass-panel border-0">
                <div class="card-body p-2 p-md-3">
                    <div class="table-responsive">
                        <table id="expenseTable" class="table table-hover w-100 align-middle">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Date</th>
                                    <th>Company</th>
                                    <th>Project</th>
                                    <th>Description</th>
                                    <th>Amount</th>
                                    <th>Bill</th>
                                </tr>
                            </thead>
                            <tbody>
                                </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/dataTables.buttons.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/pdfmake.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/vfs_fonts.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.html5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <script src="app.js"></script>
</body>
</html>
