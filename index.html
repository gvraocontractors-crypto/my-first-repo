<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GEMS | Expense Management System</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/buttons/2.4.1/css/buttons.bootstrap5.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>

    <div class="sidebar-overlay" id="mobileOverlay" onclick="toggleSidebar()"></div>

    <div class="sidebar glass-panel d-flex flex-column p-4" id="mainSidebar">
        <div class="d-flex justify-content-between align-items-center mb-5 mt-2">
            <h3 class="fw-bold m-0"><i class="fa-solid fa-gem text-primary me-2"></i>GEMS</h3>
            <button class="btn btn-sm d-lg-none glass-panel" onclick="toggleSidebar()"><i class="fa-solid fa-xmark fs-5"></i></button>
        </div>
        <ul class="nav nav-pills flex-column mb-auto gap-2">
            <li class="nav-item">
                <a href="#" class="nav-link active" onclick="switchView('add-expense')"><i class="fa-solid fa-plus me-3"></i> Record Expense</a>
            </li>
            <li>
                <a href="#" class="nav-link" onclick="switchView('dashboard')"><i class="fa-solid fa-chart-line me-3"></i> Analytics</a>
            </li>
            <li>
                <a href="#" class="nav-link" onclick="switchView('reports')"><i class="fa-solid fa-table-list me-3"></i> Reports</a>
            </li>
        </ul>
    </div>

    <div class="main-content" id="mainContent">
        
        <nav class="navbar glass-panel navbar-expand mb-4 px-4 py-3 rounded-4">
            <div class="container-fluid p-0">
                <div class="d-flex align-items-center">
                    <button class="btn glass-panel me-3 d-lg-none" onclick="toggleSidebar()">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                    <span class="navbar-brand mb-0 h4 fw-bold text-truncate" id="pageTitle">Record Expense</span>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <button class="btn glass-panel" onclick="toggleTheme()" title="Toggle Theme">
                        <i class="fa-solid fa-circle-half-stroke"></i>
                    </button>
                </div>
            </div>
        </nav>

        <div class="toast-container position-fixed top-0 end-0 p-3 z-3">
            <div id="appToast" class="toast align-items-center text-white bg-success border-0 glass-panel" role="alert">
                <div class="d-flex">
                    <div class="toast-body fw-bold fs-6" id="toastMsg">Message here</div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
                </div>
            </div>
        </div>

        <div id="add-expense" class="view-section active">
            <div class="card glass-panel border-0">
                <div class="card-body p-4 p-md-5">
                    <form id="expenseForm">
                        <div class="row g-4">
                            <div class="col-12 col-md-4">
                                <label class="fw-bold mb-1 opacity-75">Date *</label>
                                <input type="date" class="form-control form-control-lg glass-panel" id="date" required>
                            </div>
                            <div class="col-12 col-md-4">
                                <label class="fw-bold mb-1 opacity-75">Company *</label>
                                <select class="form-select form-select-lg glass-panel" id="company" required>
                                    <option value="" disabled selected>Select Company...</option>
                                    <option value="GVR Contractors">GVR Contractors</option>
                                    <option value="KRiyatech">KRiyatech</option>
                                </select>
                            </div>
                            <div class="col-12 col-md-4">
                                <label class="fw-bold mb-1 opacity-75">Entered By *</label>
                                <select class="form-select form-select-lg glass-panel" id="enteredBy" required>
                                    <option value="" disabled selected>Select Partner...</option>
                                    <option value="Gopinath">Gopinath</option>
                                    <option value="Satish">Satish</option>
                                    <option value="Partner 3">Partner 3</option>
                                </select>
                            </div>
                            
                            <div class="col-12 col-md-6">
                                <label class="fw-bold mb-1 opacity-75">Project / Site *</label>
                                <input type="text" class="form-control form-control-lg glass-panel" id="project" placeholder="e.g. Odalarevu" required>
                            </div>
                            <div class="col-12 col-md-6">
                                <label class="fw-bold mb-1 opacity-75">Description *</label>
                                <input type="text" class="form-control form-control-lg glass-panel" id="description" placeholder="What was this for?" required>
                            </div>
                            
                            <div class="col-12 col-md-3">
                                <label class="fw-bold mb-1 opacity-75">Amount (₹) *</label>
                                <input type="number" class="form-control form-control-lg glass-panel fw-bold text-primary" id="amount" required>
                            </div>
                            <div class="col-12 col-md-3">
                                <label class="fw-bold mb-1 opacity-75">Payment Mode *</label>
                                <select class="form-select form-select-lg glass-panel" id="paymentMode" required>
                                    <option value="Bank Transfer">Bank Transfer</option>
                                    <option value="UPI">UPI</option>
                                    <option value="Cash">Cash</option>
                                </select>
                            </div>
                            <div class="col-12 col-md-3">
                                <label class="fw-bold mb-1 opacity-75">Transaction ID</label>
                                <input type="text" class="form-control form-control-lg glass-panel" id="transactionId" placeholder="Optional">
                            </div>
                            <div class="col-12 col-md-3">
                                <label class="fw-bold mb-1 opacity-75">Upload Bill</label>
                                <input type="file" class="form-control form-control-lg glass-panel" id="billFile" accept="image/*,.pdf">
                            </div>
                        </div>
                        <hr class="my-5 opacity-25">
                        <button type="submit" class="btn btn-primary btn-lg w-100 py-3 fw-bold text-white rounded-4 shadow-lg" id="submitBtn">
                            <i class="fa-solid fa-cloud-arrow-up me-2"></i> Submit Expense
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <div id="dashboard" class="view-section">
            <div class="glass-panel p-4 mb-4">
                <div class="row g-3">
                    <div class="col-6 col-md-2">
                        <label class="form-label opacity-75 small fw-bold mb-1">Start Date</label>
                        <input type="date" class="form-control glass-panel" id="filterStartDate" onchange="applyFilters()">
                    </div>
                    <div class="col-6 col-md-2">
                        <label class="form-label opacity-75 small fw-bold mb-1">End Date</label>
                        <input type="date" class="form-control glass-panel" id="filterEndDate" onchange="applyFilters()">
                    </div>
                    <div class="col-6 col-md-2">
                        <label class="form-label opacity-75 small fw-bold mb-1">Month</label>
                        <select class="form-select glass-panel" id="filterMonthYear" onchange="applyFilters()">
                            <option value="All">All Months</option>
                        </select>
                    </div>
                    <div class="col-6 col-md-2">
                        <label class="form-label opacity-75 small fw-bold mb-1">Company</label>
                        <select class="form-select glass-panel" id="filterCompany" onchange="applyFilters()">
                            <option value="All">All Companies</option>
                            <option value="GVR Contractors">GVR Contractors</option>
                            <option value="KRiyatech">KRiyatech</option>
                        </select>
                    </div>
                    <div class="col-6 col-md-2">
                        <label class="form-label opacity-75 small fw-bold mb-1">Project</label>
                        <select class="form-select glass-panel" id="filterProject" onchange="applyFilters()">
                            <option value="All">All Projects</option>
                        </select>
                    </div>
                    <div class="col-6 col-md-2">
                        <label class="form-label opacity-75 small fw-bold mb-1">User</label>
                        <select class="form-select glass-panel" id="filterUser" onchange="applyFilters()">
                            <option value="All">All</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="row g-4 mb-4">
                <div class="col-12 col-md-6">
                    <div class="glass-panel kpi-card kpi-total h-100">
                        <i class="fa-solid fa-indian-rupee-sign"></i>
                        <h6 class="opacity-75 mb-2 fw-bold text-uppercase tracking-wide">Total Filtered Spend</h6>
                        <h2 id="kpi-total" class="fw-bold m-0 display-5 text-primary">₹0</h2>
                    </div>
                </div>
                <div class="col-12 col-md-6">
                    <div class="glass-panel kpi-card kpi-split h-100">
                        <i class="fa-solid fa-chart-pie"></i>
                        <h6 class="opacity-75 mb-2 fw-bold text-uppercase tracking-wide">Company Breakdown</h6>
                        <h4 class="mb-0 fw-bold fs-3" id="kpi-company">GVR: ₹0 <br> KRI: ₹0</h4>
                    </div>
                </div>
            </div>
            
            <div class="row g-4">
                <div class="col-12 col-lg-5"><div class="chart-box glass-panel"><canvas id="companyChart"></canvas></div></div>
                <div class="col-12 col-lg-7"><div class="chart-box glass-panel"><canvas id="trendChart"></canvas></div></div>
                <div class="col-12"><div class="chart-box glass-panel"><canvas id="paymentChart"></canvas></div></div>
            </div>
        </div>

        <div id="reports" class="view-section">
            <div class="card glass-panel border-0">
                <div class="card-body p-3 p-md-4">
                    <div class="table-responsive pb-2">
                        <table id="expenseTable" class="table table-hover w-100 align-middle">
                            <thead class="opacity-75">
                                <tr>
                                    <th>ID</th>
                                    <th>Date</th>
                                    <th>Company</th>
                                    <th>Project</th>
                                    <th>Description</th>
                                    <th>Amount</th>
                                    <th>Bill</th>
                                </tr>
                            </thead>
                            <tbody>
                                </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/dataTables.buttons.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/pdfmake.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/vfs_fonts.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.html5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <script src="app.js"></script>
</body>
</html>
