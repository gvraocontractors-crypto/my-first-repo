<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClearSpend Portal | GVR & KRiyatech</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/buttons/2.4.1/css/buttons.bootstrap5.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar glass-panel d-flex flex-column p-3">
        <h4 class="text-center mb-4 fw-bold mt-2"><i class="fa-solid fa-layer-group text-warning"></i> ClearSpend</h4>
        <ul class="nav nav-pills flex-column mb-auto">
            <!-- Add Expense is now First and Active -->
            <li class="nav-item">
                <a href="#" class="nav-link active" onclick="switchView('add-expense')"><i class="fa-solid fa-plus me-2"></i> Add Expense</a>
            </li>
            <li>
                <a href="#" class="nav-link" onclick="switchView('dashboard')"><i class="fa-solid fa-chart-pie me-2"></i> Dashboard</a>
            </li>
            <li>
                <a href="#" class="nav-link" onclick="switchView('reports')"><i class="fa-solid fa-table me-2"></i> Reports & Exports</a>
            </li>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        
        <!-- Navbar -->
        <nav class="navbar glass-panel navbar-expand-lg mb-4 px-4 py-3">
            <div class="container-fluid">
                <span class="navbar-brand mb-0 h4 fw-bold" id="pageTitle">Record New Expense</span>
                <div class="d-flex align-items-center gap-3">
                    <div class="input-group input-group-sm">
                        <span class="input-group-text glass-panel"><i class="fa-solid fa-user"></i></span>
                        <input type="text" id="currentUser" class="form-control glass-panel" placeholder="Your Name" value="Admin User">
                    </div>
                    <button class="btn btn-sm glass-panel" onclick="toggleTheme()" title="Toggle Dark Mode">
                        <i class="fa-solid fa-moon"></i>
                    </button>
                </div>
            </div>
        </nav>

        <!-- Toast Notifications -->
        <div class="toast-container position-fixed top-0 end-0 p-3">
            <div id="appToast" class="toast align-items-center text-bg-primary border-0 shadow glass-panel" role="alert">
                <div class="d-flex">
                    <div class="toast-body fw-bold" id="toastMsg">Message here</div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
                </div>
            </div>
        </div>

        <!-- 1. VIEW: ADD EXPENSE FORM (Now Active by Default) -->
        <div id="add-expense" class="view-section active">
            <div class="card glass-panel border-0">
                <div class="card-body p-4">
                    <form id="expenseForm">
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="fw-bold">Date *</label>
                                <input type="date" class="form-control glass-panel" id="date" required>
                            </div>
                            <div class="col-md-4">
                                <label class="fw-bold">Company *</label>
                                <select class="form-select glass-panel" id="company" required>
                                    <option value="GVR Contractors">GVR Contractors</option>
                                    <option value="KRiyatech">KRiyatech</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="fw-bold">Project / Site *</label>
                                <input type="text" class="form-control glass-panel" id="project" placeholder="e.g. Odalarevu" required>
                            </div>
                            
                            <div class="col-md-12">
                                <label class="fw-bold">Description *</label>
                                <input type="text" class="form-control glass-panel" id="description" required>
                            </div>
                            
                            <div class="col-md-3">
                                <label class="fw-bold">Amount (₹) *</label>
                                <input type="number" class="form-control glass-panel" id="amount" required>
                            </div>
                            <div class="col-md-3">
                                <label class="fw-bold">Payment Mode *</label>
                                <select class="form-select glass-panel" id="paymentMode" required>
                                    <option value="Bank Transfer">Bank Transfer</option>
                                    <option value="UPI">UPI</option>
                                    <option value="Cash">Cash</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="fw-bold">Transaction ID</label>
                                <input type="text" class="form-control glass-panel" id="transactionId">
                            </div>
                            <div class="col-md-3">
                                <label class="fw-bold">Upload Bill</label>
                                <input type="file" class="form-control glass-panel" id="billFile" accept="image/*,.pdf">
                            </div>
                        </div>
                        <hr class="my-4 border-secondary">
                        <button type="submit" class="btn btn-primary px-5 py-2 fw-bold" id="submitBtn">
                            <i class="fa-solid fa-cloud-arrow-up me-2"></i> Submit Expense
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <!-- 2. VIEW: DASHBOARD -->
        <div id="dashboard" class="view-section">
            
            <!-- GLOBAL FILTERS (Updated with Dates & MMM-YY) -->
            <div class="glass-panel p-3 mb-4">
                <div class="row g-2">
                    <div class="col-md-2">
                        <label class="form-label text-muted small fw-bold mb-1"><i class="fa-solid fa-calendar-arrow-down me-1"></i> Start Date</label>
                        <input type="date" class="form-control form-control-sm glass-panel" id="filterStartDate" onchange="applyFilters()">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label text-muted small fw-bold mb-1"><i class="fa-solid fa-calendar-arrow-up me-1"></i> End Date</label>
                        <input type="date" class="form-control form-control-sm glass-panel" id="filterEndDate" onchange="applyFilters()">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label text-muted small fw-bold mb-1"><i class="fa-solid fa-calendar-days me-1"></i> Month</label>
                        <select class="form-select form-select-sm glass-panel" id="filterMonthYear" onchange="applyFilters()">
                            <option value="All">All Months</option>
                            <!-- Populated dynamically (e.g. Jan-26) -->
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label text-muted small fw-bold mb-1"><i class="fa-solid fa-building me-1"></i> Company</label>
                        <select class="form-select form-select-sm glass-panel" id="filterCompany" onchange="applyFilters()">
                            <option value="All">All Companies</option>
                            <option value="GVR Contractors">GVR Contractors</option>
                            <option value="KRiyatech">KRiyatech</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label text-muted small fw-bold mb-1"><i class="fa-solid fa-helmet-safety me-1"></i> Project</label>
                        <select class="form-select form-select-sm glass-panel" id="filterProject" onchange="applyFilters()">
                            <option value="All">All Projects</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label text-muted small fw-bold mb-1"><i class="fa-solid fa-user-pen me-1"></i> User</label>
                        <select class="form-select form-select-sm glass-panel" id="filterUser" onchange="applyFilters()">
                            <option value="All">All Users</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- KPI Cards -->
            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <div class="kpi-card glass-panel">
                        <i class="fa-solid fa-wallet"></i>
                        <h6 class="text-muted">Total Filtered Expenses</h6>
                        <h2 id="kpi-total" class="fw-bold">₹0</h2>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="kpi-card glass-panel">
                        <i class="fa-solid fa-building"></i>
                        <h6 class="text-muted">GVR vs KRiyatech (Filtered)</h6>
                        <h4 class="mb-0 fw-bold" id="kpi-company">GVR: ₹0 | KRI: ₹0</h4>
                    </div>
                </div>
            </div>
            
            <!-- Charts -->
            <div class="row g-3">
                <div class="col-md-4"><div class="chart-box glass-panel"><canvas id="companyChart"></canvas></div></div>
                <div class="col-md-8"><div class="chart-box glass-panel"><canvas id="trendChart"></canvas></div></div>
                <div class="col-md-6 mt-4"><div class="chart-box glass-panel"><canvas id="paymentChart"></canvas></div></div>
            </div>
        </div>

        <!-- 3. VIEW: REPORTS & EXPORTS -->
        <div id="reports" class="view-section">
            <div class="card glass-panel border-0">
                <div class="card-body">
                    <div class="table-responsive">
                        <table id="expenseTable" class="table table-hover w-100 align-middle">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Date</th>
                                    <th>Company</th>
                                    <th>Project</th>
                                    <th>Description</th>
                                    <th>Amount</th>
                                    <th>Bill</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Automatically populated -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/dataTables.buttons.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/pdfmake.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/vfs_fonts.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.html5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <script src="app.js"></script>
</body>
</html>
